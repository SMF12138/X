<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>第一个组件</title>
        <link rel="icon" href="../favicon.ico" type="image/x-icon" />
        <script src="../js/vue.js"></script>
    </head>

    <body>
        <div id="app">
            <h1>{{msg}}</h1>
            <!-- 使用组件 -->
            <userlist></userlist>
            <userlist></userlist>
            <userlist></userlist>
            <!-- Vue支持自闭和标签，但必须在脚手架环境中使用 -->
            <userlogin></userlogin>
        </div>
        <div id="app2">
            <userlogin></userlogin>
        </div>
        <script>
            // 可以省略Vue.extend()，组件名字若为驼峰必须使用脚手架
            const userLoginComponent = {
                //name配置项设置Vue开发者工具中的组件名 
                name:xxx;
                // template项中必须蕴含一个根标签
                template:
                    '<div><h3>用户登录</h3><form @submit.prevent="login">账号:<input type="text" v-model="username"><br><br>密码:<input type="password" v-model="password"><br><br><button>登录</button></form></div>',
                data() {
                    return {
                        username: "",
                        password: "",
                    };
                },
                methods: {
                    login() {
                        alert(this.username + "," + this.password);
                    },
                },
            };
            //注册全局组件
            Vue.component("userlogin", userLoginComponent);
            // 创建组件，与Vue区别基本相同，但不能使用el配置
            const myCompents = Vue.extend({
                //因此使用template配置项
                template:
                    ' <ul><li v-for="(user,index) of users":key = "user.id" > {{index}},{{user.name}} </li></ul> ',
                // 组件中必须使用函数式，防止更改一个组件全体复用页面都修改
                data() {
                    return {
                        users: [
                            { id: "001", name: "jack" },
                            { id: "002", name: "lucy" },
                            { id: "003", name: "james" },
                        ],
                    };
                },
            });
            const VM = new Vue({
                el: "#app",
                data: {
                    msg: "第一个组件",
                },
                // 局部注册组件，自动调用函数
                components: {
                    // userlist是组件的名字，myCompents是变量名
                    userlist: myCompents,
                    userlogin: userLoginComponent,
                },
            });
            const VM2 = new Vue({
                el: "#app2",
            });
        </script>
    </body>
</html>
