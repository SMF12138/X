<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>表单数据的收集</title>
        <link rel="icon" href="../favicon.ico" type="image/x-icon" />
        <script src="../js/vue.js"></script>
    </head>

    <body>
        <div id="app">
            <h1>{{name}}</h1>
            <!-- 通过异步方式提交，因此阻止提交 -->
            <form @submit.prevent="send">
                用户名:<input type="text" v-model="user.username" /><br /><br />
                密码:<input
                    type="password"
                    v-model="user.password"
                /><br /><br />
                <!-- 若为v-model.number修饰将类型转为数字型 -->
                <!-- 若为v-model.trim修饰将可以去除前后空白 -->
                年龄:<input type="number" v-model="user.age" /><br /><br />
                性别: 男:<input
                    type="radio"
                    name="gander"
                    value="1"
                    v-model="user.gender"
                />
                女:<input
                    type="radio"
                    name="gander"
                    value="0"
                    v-model="user.gender"
                /><br /><br />
                爱好:
                <!-- 为避免同步映射，复选框要设置不同value，此时Vue会识别为数组 -->
                旅游<input
                    type="checkbox"
                    v-model="user.interest"
                    value="travel"
                />
                运动<input
                    type="checkbox"
                    v-model="user.interest"
                    value="sport"
                />
                唱歌<input
                    type="checkbox"
                    v-model="user.interest"
                    value="sing"
                /><br /><br />
                学历:
                <select v-model="user.grade">
                    <option value="">请选择学历</option>
                    <option value="zk">专科</option>
                    <option value="bk">本科</option>
                    <option value="ss">硕士</option></select
                ><br /><br />
                简介:
                <textarea
                    cols="50"
                    rows="15"
                    v-model="user.introduce"
                ></textarea
                ><br /><br />
                <!-- v-model.lazy设置懒加载，光标移动后才会刷新 -->
                <input
                    type="checkbox"
                    v-model.lazy="user.accept"
                />阅读并接受协议<br /><br />
                <button>注册</button>
                <!-- 或通过下面方式阻止表单提交 -->
                <!-- <button @click.prevent="send">注册</button> -->
            </form>
        </div>
        <script>
            const VM = new Vue({
                el: "#app",
                data: {
                    name: "表单数据的收集",
                    user: {
                        usename: "",
                        password: "",
                        age: "",
                        // 设置默认值
                        gender: "1",
                        grade: "ss",
                        interest: ["travel"],
                        accept: "",
                    },
                },
                methods: {
                    send() {
                        alert("ajax...");
                        console.log(JSON.stringify(this.user));
                    },
                },
            });

        </script>
    </body>
</html>
