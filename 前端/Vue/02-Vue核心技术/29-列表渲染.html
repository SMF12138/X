<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>列表渲染</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
    <script src="../js/vue.js"></script>
</head>

<body>
    <div id="app">
        <h1>{{name}}</h1>
        <h2>遍历对象的属性</h2>
        <ul>
            <li v-for="value,propertyName of user">
                {{propertyName}},{{value}}
            </li>
        </ul>
        <h2>遍历字符串</h2>
        <ul>
            <li v-for="c,index of str">{{index}},{{c}}</li>
        </ul>
        <h2>遍历指定的次数</h2>
        <ul>
            <li v-for="number,index of counter">{{index}},{{number}}</li>
        </ul>
        <!-- 静态列表 -->
        <ul>
            <li>张三</li>
            <li>李四</li>
            <li>王五</li>
        </ul>
        <!-- 动态列表 -->
        <ul>
            <!-- v-for要写在循环for上，语法如下，其中x指的是下标 -->
            <li v-for="bianliang,x in names">{{bianliang}}-{{x}}</li>
        </ul>
        <ul>
            <!-- of也可 -->
            <li v-for="bianliang,x of names">{{bianliang}}-{{x}}</li>
        </ul>
        <ul>
            <!-- of也可 -->
            <li v-for="bianliang,x of vips">
                会员名:{{bianliang.name}} 年龄:{{bianliang.age}}
            </li>
        </ul>
        <table>
            <tr>
                <th>序号</th>
                <th>会员名</th>
                <th>年龄</th>
                <th>选择</th>
            </tr>
            <tr v-for="vip,x of vips">
                <td>{{x+1}}</td>
                <td>{{vip.name}}</td>
                <td>{{vip.age}}</td>
                <td><input type="checkbox" /></td>
            </tr>
        </table>
    </div>
    <script>
    const VM = new Vue({
        el: "#app",
        data: {
            name: "条件渲染",
            names: ["jack", "lucy", "james"],
            vips: [{
                    id: "111",
                    name: "jack",
                    age: 20,
                },
                {
                    id: "222",
                    name: "lucy",
                    age: 30,
                },
                {
                    id: "333",
                    name: "james",
                    age: 40,
                },
            ],
            user: {
                id: "111",
                name: "张三",
                gender: "男",
            },
            str: "动力节点",
            counter: 10,
        },
    });
    </script>
</body>

</html>
