<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>测试el和template配置项</title>
        <link rel="icon" href="../favicon.ico" type="image/x-icon" />
        <script src="../js/vue.js"></script>
    </head>

    <body>
        <div id="app">
            <h1>{{msg}}</h1>
        </div>
        <script>
            const VM = new Vue({
                el: "#app",

                template: "<h1>{{s}}</h1>",
                // 优先走template
                data: {
                    msg: "测试el和template配置项",
                    s: "template配置项",
                },
            });
        </script>
    </body>
</html>
