<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Vue的其它指令</title>
        <link rel="icon" href="../favicon.ico" type="image/x-icon" />
        <style>
            /*v-cloak可以被Vue识别，配合样式使用使胡子语法不展现，而当Vue加载进来时会干掉v-cloak，从而达到避免闪现的效果*/
            [v-cloak] {
                display: none;
            }
        </style>
    </head>

    <body>
        <div id="app">
            <h1 v-cloak>{{name}}</h1>
        </div>
        <script>
            setTimeout(() => {
                let scriptElt = document.createElement("script");
                scriptElt.src = "../js/vue.js";
                document.head.append(scriptElt);
            }, 3000);
            setTimeout(() => {
                const VM = new Vue({
                    el: "#app",
                    data: {
                        name: "Vue的其它指令",
                    },
                });
            }, 4000);
        </script>
    </body>
</html>
