<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>事件修饰符</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
    <script src="../js/vue.js"></script>
    <style>
    .divList {
        width: 300px;
        height: 200px;
        background-color: aquamarine;
        overflow: auto;
    }

    .item {
        width: 300px;
        height: 200px;
    }
    </style>
</head>

<body>
    <div id="app">
        <h1>{{name}}</h1>
        <!-- .prevent通过修饰符避免了默认行为 -->
        <a href="https://www.baidu.com" @click.prevent="go">百度</a>
        <!-- .stop通过修饰符阻止了事件冒泡  -->
        <div @click="zd">
            <div @click.stop="zdjd">
                <button @click="go">事件冒泡</button>
            </div>
        </div>
        <!-- .capture用于事件捕获模式，捕获是由外而内，默认是由内而外  -->
        <div @click.capture="zd">
            <!-- 如果内层标签不加.capture，在外层执行后仍从最内层开始冒泡 -->
            <div @click="zdjd">
                <button @click="go">事件捕获</button>
            </div>
        </div>
        <div @click="zd">
            <!-- 如果属性事件不是通过传递过来的则执行，但不中断传递 -->
            <div @click.self="zdjd">
                <button @click="go">事件传递</button>
            </div>
        </div>
        <!-- Vue中修饰符可以联合使用 -->
        <!-- .once用于只执行一次  -->
        <button @click.once="go">事件执行</button>
        <!-- .passive用于优先执行默认行为，与prevent对立不能共用  -->
        <div class="divList" @wheel.passive="testPassive">
            <div class="item">div1</div>
            <div class="item">div2</div>
            <div class="item">div3</div>
        </div>
    </div>
    <script>
    const VM = new Vue({
        el: "#app",
        data: {
            name: "事件修饰符",
        },
        methods: {
            go(e) {
                alert("去百度");
                // 手动调用对象的prevenDefault()方法，也可以阻止事件的默认行为
                // e.preventDefault();
            },
            zdjd() {
                alert("尊嘟假嘟");
            },
            zd() {
                alert("尊嘟");
            },
            testPassive() {
                for (var i = 0; i = 10000; i++) {
                    console.log("test Passive");
                }
            },
        },
    });
    </script>
</body>

</html>
