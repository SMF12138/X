<!-- 声明文档类型 -->
<!DOCTYPE html>
<html lang="en">
<!-- head定义不在页面展示的信息配置 -->
<head>
	<!-- meta标签设置编码集 -->
	<meta charset="UTF-8">
	<!-- meta标签设置作者姓名及信息 -->
	<meta name="author" content="powernode">
	<!-- meta标签设置可搜索的关键字信息 -->
	<meta name="keywords" content="关键信息,中用(英文)逗号隔开,可搜到">
	<!-- meta标签设置页面描述信息，可在搜索页面中体现 -->
	<meta name="discription" content="这是描述信息">
	<title>我的世界</title>
</head>
<body>
	
</body>
</html>
