<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>关系选择器之后代选择器</title>
	<style type="text/css">
		/*ul li表示选中父标签ul下的所有li子类*/
		ul li{
			color: red;
		}
	</style> 
</head>
<body>
	<ul>
		<li>item</li>
		<li>item</li>
		<ol>
			<li>1</li>
			<li>2</li>
		</ol>
	</ul>
</body>
</html>
