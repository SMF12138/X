<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Document</title>
</head>
<body>
	<form action="#" method="get">
		<!-- select为下拉标签 -->
		<select name="gender">
			<!-- 每个选项的标签为option -->
			<option value="1">男</option>
			<option value="0">女</option>
		</select>
		<!-- size规定下拉大小，multiple表示支持多选 -->
		<select name="hobby" size="2" multiple>
			<option value="2">唱</option>
			<option value="3">跳</option>
			<option value="4">rap</option>
			<option value="5">篮球</option>
		</select>
		<input type="submit" value="提交数据">
	</form>
</body>
</html>
