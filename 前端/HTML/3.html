<html>

<head>
    <title>这里是标题</title>
</head>

<body>
    <!-- 围堵标签 -->
    <p>围堵标签</p>
    <!-- 自闭和标签 -->
    <p>我是块级标签，不和其他标签共享一行</p>
    文本 我是<em>行内标签</em>
    <em>行内标签</em>
    <em>行内标签</em>
    <em>行内标签- -共享一行</em>
    <hr />
    <!-- 块级可以嵌套块级，行内 -->
    <!-- 但行内不能嵌套块级 -->
    <p>
        <hr />
        我是你爹
        <hr />
    </p>
    <em>
        <strong>行内可以嵌套行内</strong>
    </em>
    <p>
      <!-- href属性表示跳转到哪个网址 -->
      <!-- title为超链接声明额外信息 -->
      <!-- target用于指定链接以何种形式呈现,_blank值表示新页面打开 -->
    <a href="https://developer.mozilla.org/" title="开始学习HTML的地方" target="_blank">
        这是一个超链接
    </a>
    </p>
</body>

</html>
