<html>
<head>
	<title>这是标题</title>
</head>
<body>
	<p>
	<!-- 布尔属性是属性的简化写法，用于表单标签 -->
	<input type="text" disabled="disabled">请输入名字
	</p>
	<p>
	<!-- 简化后 -->
	<input type="text" disabled>请输入名字
	</p>
	<!-- 属性值的引号可以省略，但是不建议使用 -->

	<!-- 单双引号可以嵌套使用进行文字描述 -->
	<a href="https://developer.mozilla.org/" title="原始'HTML'网站">超链接</a>
	<a href="https://developer.mozilla.org/" title='原始"HTML"网站'>超链接</a>
</body>
</html>
