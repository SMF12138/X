<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>相对定位</title>
		<!-- 相对定位是相对文档流进行定位 -->
		<style type="text/css">
			#pos_left {
				position: relative;
				left: -20px;
			}

			#pos_right {
				position: relative;
				left: 20px;
			}
		</style>
	</head>
	<body>
		<h2>这是位于正常的标题</h2>
		<div id="div1">
			<h2 id="pos_left">这个标题相较于正常位置向左移</h2>
			<h2 id="pos_right">这个标题相较于正常位置向右移</h2>
		</div>
	</body>
</html>
