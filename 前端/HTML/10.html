<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Document</title>
</head>
<body>
	<!-- table标签代表表格 -->
	<!-- border属性表示边框 -->
	<!-- cellspacing表示单元格间边距 -->
	<!-- cellpadding表示单元格与文字间边距 -->
	<!-- align表示表格所处位置 -->
	<table border="1px" cellspacing="0px" cellpadding="10px" align="center">
		<!-- caption给表格加入标题 -->
		<caption>用户信息表</caption>
		<!-- tr标签代表一行 -->
		<!-- bgcolor代表背景颜色 -->
		<tr bgcolor="yellow">
			<!-- td标签代表一列 -->
			<!-- th标签代表一列，同时文字加粗居中 -->
			<th>姓名</th>
			<th>年龄</th>
			<th>所在地</th>
			<th>职业</th>
		</tr>
		<!-- align表示表示文字位置 -->
		<tr align="center">
			<td>乌龟</td>
			<td>23</td>
			<td>北京</td>
			<td>大师</td>
		</tr>
		<tr align="center">
			<td>啵啵</td>
			<td>25</td>
			<td>开坛</td>
			<td>非法</td>
		</tr>
		<tr align="center">
			<td>流民</td>
			<td>22</td>
			<td>酒店</td>
			<td>夫人</td>
		</tr>
	</table>
</body>
</html>
