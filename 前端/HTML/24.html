<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>关系选择器之通用兄弟选择器</title>
		<style type="text/css">
			/*h1~p表示选中所有与h1同级的p标签*/
			h1~p {
				color: red;
			}
		</style>
	</head>
	<body>
		<div>
			<h1>标题</h1>
			<p>1</p>
			<p>2</p>
			<div>
				<p>内嵌</p>
			</div> 
			<p>3</p>
		</div>
	</body>
</html>
