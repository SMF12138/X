<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Document</title>
	<style>
		h6{
			font-size: 50px;
		}
	</style>
</head>
<body>
	<!-- 效果不代表语义，效果可以改变，但语义不变 -->
	<!-- 正常一级标签 -->
	<h1>标题</h1>
	<!-- 六级标签改变效果后变得比一级标签更大 -->
	<h6>标题</h6>
	<!-- 当我们使用一个标签时，一定是因为该位置需要使用这种语义，而不是单纯需要这种效果 -->
	<!-- 例如em，i标签都能达到斜体效果 -->
	<!-- 但em具有语义，表示强调，可被网络检索，阅读器改变读音 -->
	我很<em>庆幸</em>你没有迟到<br>
	<!-- 而i标签则不具备这些语义，只起到斜体效果 -->
	我很<i>庆幸</i>你没有迟到<br>
	<!-- strong具有加粗效果，重点强调，具有语义化 -->
	<strong>客官不可以</strong><br>
	<!-- b标签只加粗效果，没有语义 -->
	<b>客官不可以</b><br>
	<a href="https://archive.org/">东路节点官网</a>
	<!-- 超链接可以嵌套文本，标题，图片 -->
	<a href="https://archive.org/"><h1>学习JAVA来东路节点</h1></a>
	<a href="https://archive.org/" title="点我进入" target="_blank"><img src="C:\Users\86177\Desktop\严夫人.jpg"></a>
</body>
</html>
