<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>JS</title>
		<!-- JS的DOM操作是指文档操作，即可以使文档在执行时发生变化(如菜单弹出) -->
		<!-- JS的BOM操作是指浏览器操作，可以实现浏览器功能(如翻页) -->
		<!-- JS操作可在head中编写，也可在body中编写 -->
		<script type="text/javascript">
			// 这是注释

			/*
			   多行注释
			   多行注释
			*/
		</script>
	</head>
	<body></body>
</html>
