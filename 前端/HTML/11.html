<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Document</title>
</head>
<body>
	<table border="1px" cellspacing="0px" cellpadding="10px" align="center">
		<tr>
			<th>姓名</td>
			<!-- colspan用于指出合并几个列单元格 -->
			<th colspan="2">手机号</td>
		</tr>
		<tr>
			<td>张三</td>
			<td>12345678911</td>
			<td>12345678963</td>
		</tr>
		<tr>
			<td>李四</td>
			<td>12315467999</td>
			<td>46485312348</td>
		</tr>
	</table>
	<table border="1px" cellspacing="0px" cellpadding="10px" align="center">
		<tr>
			<th>姓名</td>
			<td>张三</td>
			<td>李四</td>
		</tr>
		<tr>
			<!-- rowspan用于指出合并几个行单元格 -->
			<th rowspan="2">手机号</td>
			<td>12345678911</td>
			<td>12345678963</td>
		</tr>
		<tr>
			<td>12315467999</td>
			<td>46485312348</td>
		</tr>
	</table>
</body>
</html>
