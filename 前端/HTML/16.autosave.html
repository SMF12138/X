<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <!-- 样式无关内容，CSS的出现解决了html样式冗余的问题，使结构更加清晰 -->
    <!-- style中定义样式，通过下方标签选择器的形式展现 -->
    <style type="text/css">
    span {
        background-color: yellow;
    }

    strong {
        color: rebeccapurple;
    }

    em {
        color: rebeccapurple;
    }
    /*通过类选择器的形式展现*/
    .highlight{
    	background: blue;
    }
    /*通过id选择器的形式展现*/
    #one{
    	color: gold;
    }
    #two{
    	color: gray;
    }
    /*全局选择器选中所有的元素*/
    *{
        
    }
    </style>
</head>

<body>
    <span>
        哇大豆
        <strong>
            琼哥们
        </strong>
        <em>
            师傅张
        </em>
    </span>
    <!-- 给不同标签加入类属性 -->
    <h1 class="highlight">类选择器适用于将自定义的的规则分组，将分组统一设置为一个样式</h1>
    <p class="highlight">pppppppp</p>
    <!-- 如果是单个元素一组，那么应使用id选择器 -->
    <h1 id="one">id选择器适用于分组中只有单个元素的情况</h1>
    <p id="two">pppppppp</p>
</body>

</html>
