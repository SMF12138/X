<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CSS之样式</title>
		<style type="text/css">
			/*在头部的样式设置为内部样式，一个样式作用多个标签*/
		</style>
	</head>
	<body>
		<div>
			<!-- 当只对一个元素进行样式控制时为方便起见用行内样式 -->
			<p style="color: red;">段落</p>
		</div>
	</body>
</html>
