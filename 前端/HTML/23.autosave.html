<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>关系选择器之邻接兄弟选择器</title>
		<style type="text/css">
			/*h1+p表示选中相h1的p标签*/
			h1+p {
				color: red;
			}
		</style>
	</head>
	<body>
		<div>
			<h1>标题</h1>
			<p>1</p>
			<p>2</p>
			<h1>标题</h1>
			<p>1</p>
			<p>2</p>
		</div>
	</body>
</html>
