<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>文本属性</title>
		<style type="text/css">
			#one {
				/*letter-spacing控制字母间距*/
				letter-spacing: 10px;
			}
			#two {
				/*letter-spacing-spacing控制单词间距*/
				word-spacing: 100px;
			}
			span {
				/*text-decoration文本划线设置上划线*/
				text-decoration: underline;
			}
			#p {
				/*text-decoration文本划线设置中划线*/
				text-decoration: line-through;
			}
			#蛋蛋{
				/*text-indent表示缩进，两个字符大小*/
				text-indent: 32px;
				/*text-align表示文本对齐，left和right可表示左对齐或右对齐*/
				text-align: center;
				/*line-height表示行高，如果值设置为0则文字叠在一起*/
				line-height: 80px;
			}

		</style>
	</head>
	<body>
		<p id="one">俯首称臣</p>
		<p id="two">亢龙有悔 <span id="o">笑死了</span>我是你爹</p>
		<p>亢龙有悔 <span id="p">笑死了</span>我是你爹</p>
		<p id="蛋蛋">我嘞个豆这是一行文字我嘞个豆这是一行文字我嘞个豆这是一行文字我嘞个豆这是一行文字我嘞个豆这是一行文字我嘞个豆这是一行文字我嘞个豆这是一行文字我嘞个豆这是一行文字我嘞个豆这是一行文字我嘞个豆这是一行文字我嘞个豆这是一行文字</p>
	</body>
</html>
