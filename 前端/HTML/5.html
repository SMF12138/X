<html>
	<head>
		<title>这是标题</title>
	</head>

	<body>
		<!-- 如<>&这种特殊符号容易产生歧义，需要使用实体字符 -->
		<!-- 这是一个错误示例 -->
		<p> 3 < 5 </p>
		<!-- 正确的实例 -->
		<p> 3 &lt; 5 </p>
		<!-- 其他实体字符 -->
		<p>&gt;大于号 &quot;双引号 &apos;单引号 &amp;与符号</p>
		<!-- 浏览器只展示一个空格 -->
		<p>我学习 HTML</p>
		<!-- 若需加入空格需要加入&nbsp; -->
		<p>我学习&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;HTML</p>
	</body>
</html>
