<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>各种框框</title>
		<script type="text/javascript">
			// 下面所有window对象由于过于常用默认可省
			// 警告框
			window.alert("我是你爸爸");
			// 询问框
			var key = window.prompt("请输入你的儿子编号");
			console.log(key);
			// 确认框
			if (window.confirm("您确认成为我的儿子吗")) {
				console.log("恭喜你");
			} else {
				console.log("我是你爹");
			}
		</script>
	</head>
	<body></body>
</html>
