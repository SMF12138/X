<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS定义列表属性</title>
	<style type="text/css">
		ol{
			/*将列表样式设为无，此外还有disc实心圆点，circle空心圆点，square实心方块，decimal数字，lower-roman，upper-roman，lower-alpha，upper-alpha等*/
			list-style-type: none;
		}
	</style>
</head>
<body>
	<ol>
		<li>抽烟</li>
		<li>喝酒</li>
		<li>烫头</li>
	</ol>
</body>
</html>
